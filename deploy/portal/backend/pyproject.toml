[project]
name = "atexispocs-portal-backend"
version = "0.1.0"
description = "atexispocs portal — MFA login + shared session cookie (SSO option A)."
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.0",
    "cryptography>=44.0",
    "truststore>=0.10",
    "httpx>=0.27",
    "mcp>=1.30",
    "websockets>=15.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
