<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>AI4TECHDOC</title>

    <!--
      Portail de lancement des POCs deployes sous un chemin parent commun
      (IIS : .../AtexisPOCS/). Poser CE fichier a la
      RACINE de ce chemin parent ; chaque POC est une sous-application IIS.
      Les liens sont RELATIFS (href="corpus-agent/") -> la page fonctionne
      quel que soit le chemin parent, sans URL ni IP en dur. Voir README.md.

      Reprend le style du portail IT (titre Inter bold, cartes sobres) et
      ajoute un switch FR/EN comme les apps (persiste sous
      localStorage["atexis-portal-lang"]). Pour ajouter/retirer un POC :
      editer le tableau POCS ci-dessous (nom + description FR/EN).

      Artefact de deploiement hors perimetre POC : les couleurs sont un miroir
      manuel de design-tokens/tokens.json (une page statique ne peut pas
      consommer le preset Tailwind). Ecart assume, cf. README.md.
    -->
    <script>
      // Anti-flash : applique le theme avant le premier rendu. Meme cle
      // localStorage ("theme") et memes valeurs ("dark"/"light") que les POCs.
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {
          /* localStorage indisponible : on garde le theme sombre par defaut */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@500;600;700&display=swap"
    />
    <link rel="stylesheet" href="portal.css" />

    <style>
      :root {
        --card-external: #1d1f2f;
        --card-external-hover: #252840;
        --external-accent: #f59e0b;
      }
      html.light {
        --card-external: #fff7ed;
        --card-external-hover: #ffedd5;
        --external-accent: #b45309;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
      }
      .section {
        margin-top: 28px;
      }
      .section-title {
        margin: 0 0 14px;
        color: var(--dim);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 26px 28px;
        text-decoration: none;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        transition: border-color 0.15s, background 0.15s;
      }
      .card:hover {
        background: var(--card-hover);
        border-color: var(--brand);
      }
      .card.validation {
        border-color: rgba(245, 158, 11, 0.45);
        background: rgba(245, 158, 11, 0.06);
      }
      .card.validation:hover {
        border-color: rgba(245, 158, 11, 0.8);
        background: rgba(245, 158, 11, 0.12);
      }
      .card.external {
        background: var(--card-external);
        border-color: color-mix(in srgb, var(--external-accent) 28%, var(--border));
      }
      .card.external:hover {
        background: var(--card-external-hover);
        border-color: var(--external-accent);
      }
      .card:focus-visible {
        outline: 2px solid var(--brand-light);
        outline-offset: 2px;
      }
      .card.external:focus-visible {
        outline-color: var(--external-accent);
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .card-name {
        font-weight: 700;
        font-size: 20px;
        color: var(--text);
      }
      .card-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 88px;
        padding: 5px 8px;
        border-radius: 999px;
        border: 1px solid rgba(245, 158, 11, 0.45);
        background: rgba(245, 158, 11, 0.12);
        color: #fbbf24;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .card-desc {
        color: var(--dim);
        font-size: 14px;
      }
      .empty {
        color: var(--dim);
        border: 1px dashed var(--border-md);
        border-radius: var(--radius-lg);
        padding: 40px;
        text-align: center;
      }
      footer {
        margin-top: 44px;
        color: var(--dim);
        font-size: 13px;
      }

      /* ---- SSO login gate (portal-auth.js) ---- */
      .hidden { display: none !important; }
      .login-overlay {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        /* var(--bg) n'existe pas dans portal.css (seul --bg-base existe) ->
           CSS invalide -> fond transparent -> la grille d'apps restait
           visible derriere l'overlay. On reprend le MEME fond que <body>
           (gradient + --portal-bg) pour un recouvrement plein-page, comme
           l'ecran de login IPMS/KleamPy/elecgraph. */
        background:
          linear-gradient(145deg, color-mix(in srgb, var(--portal-brand) 8%, transparent), transparent 38%),
          var(--bg-base);
      }
      .login-box {
        width: 100%;
        max-width: 420px;
        box-sizing: border-box;
        padding: 32px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        text-align: center;
      }
      .login-brand {
        font-family: "Orbitron", sans-serif;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--brand-light, var(--brand));
      }
      .login-box h1 { font-size: 22px; margin: 10px 0 6px; color: var(--text); }
      .login-sub { color: var(--dim); font-size: 14px; margin: 0 0 18px; }
      /* Encart d'info corporate (meme intention que IPMS/KleamPy/elecgraph :
         rappeler que le compte doit etre @atexis.com et comment la MFA se
         deroule, avant que l'utilisateur ne saisisse quoi que ce soit). */
      .login-info {
        margin: 0 0 18px;
        padding: 12px 14px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--brand) 8%, var(--card-hover, var(--card)));
        border: 1px solid color-mix(in srgb, var(--brand) 25%, var(--border));
        color: var(--dim);
        font-size: 13px;
        line-height: 1.5;
        text-align: left;
      }
      .login-form { display: flex; flex-direction: column; text-align: left; gap: 6px; }
      .login-form label { font-size: 13px; font-weight: 600; color: var(--text); margin-top: 8px; }
      .login-form input, .login-mfa-code-group input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid var(--border-md, var(--border));
        border-radius: 8px;
        background: var(--card-hover, var(--card));
        color: var(--text);
        font: inherit;
      }
      .login-form input:focus, .login-mfa-code-group input:focus {
        outline: none;
        border-color: var(--brand);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 25%, transparent);
      }
      .login-submit {
        margin-top: 14px;
        padding: 11px 16px;
        border: none;
        border-radius: 8px;
        background: var(--brand);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .login-submit:disabled { opacity: 0.6; cursor: not-allowed; }
      .login-error {
        margin-top: 12px;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 13px;
        color: #fca5a5;
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.35);
      }
      .login-mfa { text-align: center; }
      .login-mfa-status { color: var(--dim); font-size: 14px; margin-bottom: 12px; min-height: 1.2em; }
      .login-mfa-number {
        width: 92px; height: 92px; margin: 8px auto 14px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 16px; background: var(--brand); color: #fff;
        font-size: 34px; font-weight: 800;
      }
      .login-mfa-code-group { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .login-mfa-code-group input { max-width: 220px; text-align: center; font-size: 20px; letter-spacing: 0.3em; }
      .login-mfa-choose { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; }
      .login-choose-option {
        padding: 10px 12px; text-align: left;
        border: 1px solid var(--border-md, var(--border)); border-radius: 8px;
        background: var(--card-hover, var(--card)); color: var(--text); cursor: pointer;
      }
      .login-choose-option:hover { border-color: var(--brand); }
      .login-link {
        margin-top: 10px; background: none; border: none;
        color: var(--dim); text-decoration: underline; cursor: pointer; font: inherit;
      }
      /* Badge utilisateur : flottant en coin haut-droit (position fixed),
         au-dessus de la ligne du header (top assez petit pour rester dans
         le padding-top du body, avant que .portal-topbar ne commence) ->
         ne chevauche plus le nav/FR-EN. Boite fermee (fond + bordure
         arrondie) avec texte centre, pour rester lisible quel que soit ce
         qu'il y a derriere. */
      .portal-user-badge {
        position: fixed;
        top: 8px;
        right: 20px;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--border);
        font-size: 12px;
        color: var(--dim);
        text-align: center;
        white-space: nowrap;
      }
      /* #portal-logout reutilise .login-link (bouton du formulaire de login),
         dont le `margin-top: 10px` decalait "Log out" plus bas que le nom a
         cote -> desalignement vertical dans la pilule. Reset ici. */
      .portal-user-badge .login-link {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <!-- SSO login gate (option A). Visible par defaut : le lanceur n'est jamais
         montre avant que la session soit verifiee. portal-auth.js le masque
         quand authentifie. -->
    <div id="login-overlay" class="login-overlay hidden">
      <div class="login-box">
        <span class="login-brand">AI4TECHDOC</span>
        <h1 id="login-title"></h1>
        <p id="login-sub" class="login-sub"></p>
        <p id="login-info" class="login-info hidden"></p>

        <form id="login-form" class="login-form hidden">
          <label id="login-email-label" for="login-email"></label>
          <input id="login-email" type="email" placeholder="name@atexis.com" autocomplete="username" required />
          <label id="login-password-label" for="login-password"></label>
          <input id="login-password" type="password" autocomplete="current-password" required />
          <button type="submit" id="login-submit" class="login-submit"></button>
          <p id="login-email-error" class="login-error hidden"></p>
        </form>

        <div id="login-mfa" class="login-mfa hidden">
          <p id="login-mfa-status" class="login-mfa-status"></p>
          <div id="login-mfa-number" class="login-mfa-number hidden"></div>
          <div id="login-mfa-code-group" class="login-mfa-code-group hidden">
            <input id="login-mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" />
            <button type="button" id="login-mfa-submit" class="login-submit"></button>
          </div>
          <div id="login-mfa-choose" class="login-mfa-choose hidden"></div>
          <button type="button" id="login-cancel" class="login-link hidden"></button>
          <p id="login-mfa-error" class="login-error hidden"></p>
        </div>
      </div>
    </div>

    <div id="portal-user-badge" class="portal-user-badge hidden">
      <span id="portal-user-name"></span>
      <button type="button" id="portal-logout" class="login-link"></button>
    </div>

    <div class="portal-page">
      <div id="portal-header"></div>

      <div id="grid"></div>

      <footer id="footer"></footer>
    </div>

    <script src="portal-auth.js"></script>
    <script src="portal.js"></script>
    <script>
      PortalUI.mountHeader({
        activePage: "portal",
        title: "AI4TECHDOC",
        subtitle: "Notre écosystème innovant pour la documentation"
      });

      // ==== Configuration externalisée (HR0/HR8 — Everything configurable) =====
      // La liste des POCs et les strings i18n sont maintenant chargées depuis
      // config.json (fichier externe), pas hardcodées en JavaScript.
      // Pour ajouter/retirer un POC : éditer config.json, pas ce fichier.
      let CONFIG = null;
      let POCS = [];
      let I18N = {
        fr: {
          empty: "Aucun POC configuré. Vérifier config.json.",
        },
        en: {
          empty: "No POC configured. Check config.json.",
        },
      };
      let currentLang = "fr";

      // Charger config.json (external configuration file per HR0/HR8)
      fetch("config.json", { cache: "no-cache" })
        .then((r) => r.json())
        .then((data) => {
          CONFIG = data;
          POCS = data.pocs || [];
          // Merger les strings de config avec les fallbacks
          I18N.fr.subtitle = data.subtitle?.fr || I18N.fr.subtitle;
          I18N.fr.footer = data.footer?.fr || I18N.fr.footer;
          I18N.en.subtitle = data.subtitle?.en || I18N.en.subtitle;
          I18N.en.footer = data.footer?.en || I18N.en.footer;
          // Réappliquer la langue actuelle pour afficher la config mise à jour
          applyLang(currentLang);
        })
        .catch(() => {
          // Fallback gracieux : afficher message erreur et continuer
          document.getElementById("grid").innerHTML =
            '<div class="empty">Configuration indisponible. Vérifier config.json.</div>';
        });
      // =========================================================================

      const grid = document.getElementById("grid");
      const footer = document.getElementById("footer");

      function buildSection(title, items, lang) {
        const section = document.createElement("section");
        section.className = "section";
        const h2 = document.createElement("h2");
        h2.className = "section-title";
        h2.textContent = title;
        section.appendChild(h2);

        const list = document.createElement("div");
        list.className = "grid";

        items.forEach((poc) => {
          const a = document.createElement("a");
          a.className = "card";
          if (poc.status === "validation") {
            a.classList.add("validation");
          }
          const isExternalUrl = typeof poc.url === "string" && /^https?:\/\//i.test(poc.url);
          a.href = isExternalUrl ? poc.url : poc.slug + "/";
          if (isExternalUrl) {
            a.classList.add("external");
          }
          if (isExternalUrl) {
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          }
          a.innerHTML = '<div class="card-head"><div class="card-name"></div><div class="card-badge"></div></div><div class="card-desc"></div>';
          a.querySelector(".card-name").textContent = poc.name;
          const badge = a.querySelector(".card-badge");
          if (poc.status === "validation") {
            badge.textContent = lang === "fr" ? "À valider" : "To validate";
          } else {
            badge.textContent = "";
            badge.style.display = "none";
          }
          a.querySelector(".card-desc").textContent = poc.desc[lang];
          list.appendChild(a);
        });

        section.appendChild(list);
        return section;
      }

      function renderCards(lang) {
        grid.innerHTML = "";
        if (!POCS.length) {
          const div = document.createElement("div");
          div.className = "empty";
          div.textContent = I18N[lang].empty;
          grid.appendChild(div);
          return;
        }

        const active = POCS.filter((poc) => poc.status !== "validation");
        const validation = POCS.filter((poc) => poc.status === "validation");

        if (active.length) {
          grid.appendChild(buildSection(lang === "fr" ? "Applications actives" : "Active applications", active, lang));
        }
        if (validation.length) {
          grid.appendChild(buildSection(lang === "fr" ? "À valider" : "To validate", validation, lang));
        }
      }

      function applyLang(lang) {
        currentLang = lang;
        document.getElementById("page-title").textContent = CONFIG?.title || "AI4TECHDOC";
        if (I18N[lang].subtitle) document.getElementById("page-subtitle").textContent = I18N[lang].subtitle;
        footer.textContent = I18N[lang].footer || "";
        renderCards(lang);
      }

      PortalUI.initialize(applyLang);
    </script>
  </body>
</html>
