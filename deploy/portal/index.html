<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Atexis POCs</title>

    <!--
      Portail de lancement des POCs deployes sous un chemin parent commun
      (IIS : .../AtexisPOCS/ ou /app/atexispocs-cd/). Poser CE fichier a la
      RACINE de ce chemin parent ; chaque POC est une sous-application IIS.
      Les liens sont RELATIFS (href="corpus-agent/") -> la page fonctionne
      quel que soit le chemin parent, sans URL ni IP en dur. Voir README.md.

      Reprend le style du portail IT (titre Inter bold, cartes sobres) et
      ajoute un switch FR/EN comme les apps (persiste sous
      localStorage["atexis-portal-lang"]). Pour ajouter/retirer un POC :
      editer le tableau POCS ci-dessous (nom + description FR/EN).

      Artefact de deploiement hors perimetre POC : les couleurs sont un miroir
      manuel de design-tokens/tokens.json (une page statique ne peut pas
      consommer le preset Tailwind). Ecart assume, cf. README.md.
    -->
    <script>
      // Anti-flash : applique le theme avant le premier rendu. Meme cle
      // localStorage ("theme") et memes valeurs ("dark"/"light") que les POCs.
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {
          /* localStorage indisponible : on garde le theme sombre par defaut */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <style>
      :root {
        --bg-base: #0e1117;
        --bg-2: #131720;
        --card: #161c2b;
        --card-hover: #1d2540;
        --card-external: #1d1f2f;
        --card-external-hover: #252840;
        --brand: #2563eb;
        --brand-light: #3b82f6;
        --external-accent: #f59e0b;
        --on-brand: #ffffff;
        --text: #e2e8f0;
        --dim: #94a3b8;
        --border: rgba(255, 255, 255, 0.07);
        --border-md: rgba(255, 255, 255, 0.12);
        --radius-lg: 12px;
        --radius-sm: 8px;
      }
      html.light {
        --bg-base: #ffffff;
        --bg-2: #f8fafc;
        --card: #ffffff;
        --card-hover: #f1f5f9;
        --card-external: #fff7ed;
        --card-external-hover: #ffedd5;
        --brand: #2563eb;
        --brand-light: #3b82f6;
        --external-accent: #b45309;
        --on-brand: #ffffff;
        --text: #0f172a;
        --dim: #64748b;
        --border: rgba(0, 0, 0, 0.07);
        --border-md: rgba(0, 0, 0, 0.12);
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg-base);
        color: var(--text);
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: clamp(28px, 6vw, 64px) 32px 56px;
      }
      header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }
      .title {
        font-weight: 800;
        font-size: clamp(28px, 5vw, 44px);
        letter-spacing: -0.02em;
        color: var(--text);
        margin: 0;
      }
      .subtitle {
        color: var(--dim);
        margin: 10px 0 40px;
        font-size: clamp(15px, 2vw, 18px);
      }

      .controls {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .lang-switch {
        display: inline-flex;
        border: 1px solid var(--border-md);
        border-radius: var(--radius-sm);
        overflow: hidden;
      }
      .lang-btn {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--dim);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.06em;
        padding: 8px 11px;
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
      }
      .lang-btn:hover {
        color: var(--text);
        background: var(--card-hover);
      }
      .lang-btn.active {
        color: var(--on-brand);
        background: var(--brand);
      }
      .theme-toggle {
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border-md);
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--dim);
        cursor: pointer;
        transition: color 0.15s, background 0.15s, border-color 0.15s;
      }
      .theme-toggle:hover {
        color: var(--text);
        background: var(--card-hover);
      }
      .theme-toggle .moon {
        display: none;
      }
      html.light .theme-toggle .sun {
        display: none;
      }
      html.light .theme-toggle .moon {
        display: inline;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 26px 28px;
        text-decoration: none;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        transition: border-color 0.15s, background 0.15s;
      }
      .card:hover {
        background: var(--card-hover);
        border-color: var(--brand);
      }
      .card.external {
        background: var(--card-external);
        border-color: color-mix(in srgb, var(--external-accent) 28%, var(--border));
      }
      .card.external:hover {
        background: var(--card-external-hover);
        border-color: var(--external-accent);
      }
      .card:focus-visible {
        outline: 2px solid var(--brand-light);
        outline-offset: 2px;
      }
      .card.external:focus-visible {
        outline-color: var(--external-accent);
      }
      .card-name {
        font-weight: 700;
        font-size: 20px;
        color: var(--text);
      }
      .card-desc {
        color: var(--dim);
        font-size: 14px;
      }
      .empty {
        color: var(--dim);
        border: 1px dashed var(--border-md);
        border-radius: var(--radius-lg);
        padding: 40px;
        text-align: center;
      }
      footer {
        margin-top: 44px;
        color: var(--dim);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1 class="title">Atexis POCs</h1>
        <div class="controls">
          <div class="lang-switch" role="group" aria-label="Language">
            <button type="button" class="lang-btn" data-lang="fr">FR</button>
            <button type="button" class="lang-btn" data-lang="en">EN</button>
          </div>
          <button type="button" class="theme-toggle" id="theme-toggle">
            <svg class="sun" width="17" height="17" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
            </svg>
            <svg class="moon" width="17" height="17" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
        </div>
      </header>
      <p class="subtitle" id="subtitle"></p>

      <div class="grid" id="grid"></div>

      <footer id="footer"></footer>
    </div>

    <script>
      // ==== Configuration externalisée (HR0/HR8 — Everything configurable) =====
      // La liste des POCs et les strings i18n sont maintenant chargées depuis
      // config.json (fichier externe), pas hardcodées en JavaScript.
      // Pour ajouter/retirer un POC : éditer config.json, pas ce fichier.
      let CONFIG = null;
      let POCS = [];
      let I18N = {
        fr: {
          empty: "Aucun POC configuré. Vérifier config.json.",
          themeLabel: "Basculer le thème clair / sombre",
        },
        en: {
          empty: "No POC configured. Check config.json.",
          themeLabel: "Toggle light / dark theme",
        },
      };

      // Charger config.json (external configuration file per HR0/HR8)
      fetch("config.json", { cache: "no-cache" })
        .then((r) => r.json())
        .then((data) => {
          CONFIG = data;
          POCS = data.pocs || [];
          // Merger les strings de config avec les fallbacks
          I18N.fr.subtitle = data.subtitle?.fr || I18N.fr.subtitle;
          I18N.fr.footer = data.footer?.fr || I18N.fr.footer;
          I18N.en.subtitle = data.subtitle?.en || I18N.en.subtitle;
          I18N.en.footer = data.footer?.en || I18N.en.footer;
          // Réappliquer la langue actuelle pour afficher la config mise à jour
          applyLang(initialLang());
        })
        .catch((err) => {
          console.error("Failed to load config.json:", err);
          // Fallback gracieux : afficher message erreur et continuer
          document.getElementById("grid").innerHTML =
            '<div class="empty">Configuration indisponible. Vérifier config.json.</div>';
        });
      // =========================================================================

      const LANG_KEY = "atexis-portal-lang";
      function initialLang() {
        try {
          const stored = localStorage.getItem(LANG_KEY);
          if (stored === "fr" || stored === "en") return stored;
        } catch (e) {
          /* localStorage indisponible */
        }
        return (navigator.language || "fr").slice(0, 2).toLowerCase() === "en" ? "en" : "fr";
      }

      const grid = document.getElementById("grid");
      const subtitle = document.getElementById("subtitle");
      const footer = document.getElementById("footer");
      const themeToggle = document.getElementById("theme-toggle");

      function renderCards(lang) {
        grid.innerHTML = "";
        if (!POCS.length) {
          const div = document.createElement("div");
          div.className = "empty";
          div.textContent = I18N[lang].empty;
          grid.appendChild(div);
          return;
        }
        for (const poc of POCS) {
          const a = document.createElement("a");
          a.className = "card";
          const isExternalUrl = typeof poc.url === "string" && /^https?:\/\//i.test(poc.url);
          a.href = isExternalUrl ? poc.url : poc.slug + "/";
          if (isExternalUrl) {
            a.classList.add("external");
          }
          if (isExternalUrl) {
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          }
          a.innerHTML = '<div class="card-name"></div><div class="card-desc"></div>';
          a.querySelector(".card-name").textContent = poc.name;
          a.querySelector(".card-desc").textContent = poc.desc[lang];
          grid.appendChild(a);
        }
      }

      function applyLang(lang) {
        document.documentElement.lang = lang;
        subtitle.textContent = I18N[lang].subtitle;
        footer.textContent = I18N[lang].footer;
        themeToggle.setAttribute("aria-label", I18N[lang].themeLabel);
        document.querySelectorAll(".lang-btn").forEach(function (btn) {
          btn.classList.toggle("active", btn.dataset.lang === lang);
        });
        renderCards(lang);
        try {
          localStorage.setItem(LANG_KEY, lang);
        } catch (e) {
          /* localStorage indisponible : le choix reste effectif pour la session */
        }
      }

      applyLang(initialLang());

      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          applyLang(btn.dataset.lang);
        });
      });

      themeToggle.addEventListener("click", function () {
        const isLight = document.documentElement.classList.toggle("light");
        try {
          localStorage.setItem("theme", isLight ? "light" : "dark");
        } catch (e) {
          /* localStorage indisponible : le toggle reste effectif pour la session */
        }
      });
    </script>
  </body>
</html>
