# === AtexisPOCS — nginx locations ===
# Each POC: static frontend + API reverse-proxy to its uvicorn backend.
# CSP adapted for POC frontends (inline theme script).

# --- Portal ---
location /atexispocs/ {
    alias /home/coder/atexispocs/portal/;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ /atexispocs/index.html;
}

# --- Portal auth API (port 8005) — MFA login + shared session cookie (WS relay) ---
location /atexispocs/api/ {
    proxy_pass http://127.0.0.1:8005/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_request_buffering off;
}

