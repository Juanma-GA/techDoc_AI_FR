name: Reusable Go backend CI

on:
  workflow_call:
    inputs:
      app:
        description: Registered application slug
        required: true
        type: string

permissions:
  contents: read

jobs:
  backend:
    name: ${{ inputs.app }} Go backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: apps/${{ inputs.app }}/backend/go.mod
          cache: true
          cache-dependency-path: apps/${{ inputs.app }}/backend/go.sum

      - name: Test backend
        working-directory: apps/${{ inputs.app }}/backend
        run: go test ./...
