name: Doc Reviewer CI

on:
  pull_request:
    paths:
      - "apps/doc-reviewer/**"
      - "packages/**"
      - "design-tokens/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/doc-reviewer-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/doc-reviewer/**"
      - "packages/**"
      - "design-tokens/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/doc-reviewer-ci.yml"
  workflow_dispatch:

concurrency:
  group: doc-reviewer-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Doc Reviewer backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/doc-reviewer/backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/doc-reviewer/backend/pyproject.toml

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test backend
        run: pytest -q

  frontend:
    name: Doc Reviewer frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --filter "@apps/doc-reviewer-frontend" lint

      - name: Typecheck frontend
        run: pnpm --filter "@apps/doc-reviewer-frontend" typecheck

      - name: Test frontend
        run: pnpm --filter "@apps/doc-reviewer-frontend" test

      - name: Install Playwright browser
        run: pnpm --filter "@apps/doc-reviewer-frontend" exec playwright install --with-deps chromium webkit

      - name: Run browser smoke test
        run: pnpm --filter "@apps/doc-reviewer-frontend" test:e2e

      - name: Build frontend
        run: pnpm --filter "@apps/doc-reviewer-frontend" build
