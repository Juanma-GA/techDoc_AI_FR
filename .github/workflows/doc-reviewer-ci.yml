name: Doc Reviewer Content Policy

on:
  pull_request:
    paths:
      - "apps/doc-reviewer/**"
      - "packages/**"
      - "design-tokens/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/doc-reviewer-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/doc-reviewer/**"
      - "packages/**"
      - "design-tokens/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/doc-reviewer-ci.yml"
  workflow_dispatch:

concurrency:
  group: doc-reviewer-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-content:
    name: Doc Reviewer repository content policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Reject tracked non-anonymous PDF and Word documents
        shell: bash
        run: |
          tracked_documents="$(git ls-files -- 'apps/doc-reviewer' | grep -Ei '\.(pdf|docx?)$' || true)"
          forbidden_files="$(printf '%s\n' "$tracked_documents" | grep -Eiv '(^|/)[^/]*anonyme[^/]*\.pdf$' || true)"
          if [ -n "$forbidden_files" ]; then
            printf '%s\n' "::error::PDF filenames must contain 'anonyme'; DOC and DOCX files must not be committed under apps/doc-reviewer."
            printf '%s\n' "$forbidden_files"
            exit 1
          fi
          echo "No disallowed PDF, DOC, or DOCX files found under apps/doc-reviewer."
