name: Reusable FastAPI backend CI

on:
  workflow_call:
    inputs:
      app:
        description: Registered application slug
        required: true
        type: string

permissions:
  contents: read

jobs:
  backend:
    name: ${{ inputs.app }} FastAPI backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/${{ inputs.app }}/backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: apps/${{ inputs.app }}/backend
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test backend
        working-directory: apps/${{ inputs.app }}/backend
        run: pytest -q
