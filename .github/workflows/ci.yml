name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: Discover registered apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Generate CI matrix from app registry
        id: generate
        run: echo "value=$(node scripts/ci_matrix.mjs)" >> "$GITHUB_OUTPUT"

  repository-quality:
    name: Repository checks and shared UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository standard and app registry
        run: bash scripts/check_standard.sh

      - name: Test repository tooling
        run: pnpm test:tooling

      - name: Lint shared UI
        run: pnpm --filter @internal/ui lint

      - name: Test shared UI
        run: pnpm --filter @internal/ui test

  frontend:
    name: ${{ matrix.app.slug }} frontend
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.matrix).frontends }}
    uses: ./.github/workflows/reusable-frontend-ci.yml
    with:
      app: ${{ matrix.app.slug }}
      e2e: ${{ matrix.app.e2e }}

  fastapi-backend:
    name: ${{ matrix.app }} FastAPI backend
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.matrix).fastapiBackends }}
    uses: ./.github/workflows/reusable-python-backend-ci.yml
    with:
      app: ${{ matrix.app }}

  go-backend:
    name: ${{ matrix.app }} Go backend
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.matrix).goBackends }}
    uses: ./.github/workflows/reusable-go-backend-ci.yml
    with:
      app: ${{ matrix.app }}
