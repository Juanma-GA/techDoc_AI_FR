name: CI

# Garde la branche main saine avant deploiement (l'IT deploie depuis main).
# Perimetre : ftm (pytest + check_standard). CI seule, pas de deploiement.
# Ecart au standard "pas de CI" assume — voir apps/ftm/README.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Une seule execution par ref ; annule les runs obsoletes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ftm-backend:
    name: ftm backend (pytest + check_standard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ftm backend (+ dev deps)
        run: python -m pip install --upgrade pip && pip install -e "./apps/ftm/backend[dev]"

      - name: Run ftm backend tests
        working-directory: apps/ftm/backend
        run: pytest -q

      - name: Standard conformance check
        run: bash scripts/check_standard.sh
