name: CI

# Garde la branche main saine avant deploiement (l'IT deploie depuis main).
# Perimetre : corpus-agent — backend (pytest + check_standard) et frontend (typecheck +
# build, le "pnpm build" demande par l'IT). CI seule, pas de deploiement.
# Ecart au standard "pas de CI" assume — voir apps/corpus-agent/README.md.
# Pas de cache (pip/pnpm) : le repo ne versionne pas de lockfile.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Une seule execution par ref ; annule les runs obsoletes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus-agent-backend:
    name: corpus-agent backend (pytest + check_standard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install corpus-agent backend (+ dev deps)
        run: python -m pip install --upgrade pip && pip install -e "./apps/corpus-agent/backend[dev]"

      - name: Run corpus-agent backend tests
        working-directory: apps/corpus-agent/backend
        run: pytest -q

      - name: Standard conformance check
        run: bash scripts/check_standard.sh

  corpus-agent-frontend:
    name: corpus-agent frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install workspace deps
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck + build corpus-agent frontend
        run: pnpm --filter "@apps/corpus-agent-frontend" build
