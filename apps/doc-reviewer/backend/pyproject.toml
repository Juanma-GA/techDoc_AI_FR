[project]
name = "doc-reviewer-backend"
version = "0.1.0"
description = "Doc Reviewer — backend FastAPI + PyMuPDF. Revue detection-first Word/PDF via PDF fidele + checklist Excel + regles LLM."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.28",
    "regex==2025.11.3",
    "sse-starlette>=2.2",
    "structlog>=24.1",
    "truststore>=0.10",
    "python-multipart>=0.0.9",
    "PyMuPDF>=1.24",
    "slowapi>=0.1.9",
    "cryptography>=44.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "httpx2>=1.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[tool.setuptools.package-data]
"app.checks" = ["active_client.json"]
"app.checks.thales_rules" = ["*.json"]
"app.checks.sample_client" = ["*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
