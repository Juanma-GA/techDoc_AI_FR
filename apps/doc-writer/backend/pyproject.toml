# F-07 (hardening 2026-09-14) : les bornes `>=` ci-dessous restent volontairement
# larges (compat editable install / dev), mais le build/deploiement REPRODUCTIBLE
# passe par `requirements.lock.txt` (versions exactes + hashes sha256), genere
# via pip-tools :
#   pip install -e ".[dev]"
#   python -m piptools compile --generate-hashes --output-file=requirements.lock.txt pyproject.toml
# Installer depuis le lock (verifie les hashes) : pip install -r requirements.lock.txt
[project]
name = "doc-writer-backend"
version = "0.1.0"
description = "doc-writer — POC génération de contenu RAG : FastAPI + Pydantic v2 + SQLAlchemy 2."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.28",
    "cryptography>=44.0",
    "sse-starlette>=2.2",
    "structlog>=24.1",
    "truststore>=0.10",
    "python-multipart>=0.0.9",
    "numpy>=2.0",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "pdf2docx>=0.5",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "reportlab>=4.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.6",
    "mypy>=1.10",
    "pip-tools>=7.6",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
