<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Catia Toolbox</title>
  <script>
    (function () {
      var stored = localStorage.getItem("theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (stored === "dark" || (!stored && prefersDark) || stored === null) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700&display=swap" />
  <style>
    /*__CSS_VARS__*/

    .theme-toggle { display: inline-flex; align-items: center; justify-content: center; margin-left: auto; width: 28px; height: 28px; padding: 0; border: none; background: transparent; color: var(--fg-dim); border-radius: 6px; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .theme-toggle:hover { background: var(--card-hover); color: var(--fg); }
    .theme-toggle:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--brand-light); }
    .theme-toggle-sun { display: none; }
    .theme-toggle-moon { display: block; }
    .dark .theme-toggle-sun { display: block; }
    .dark .theme-toggle-moon { display: none; }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { font-size: 13.5px; }
    body { font-family: "Inter", sans-serif; line-height: 1.5; background: var(--bg); color: var(--fg); min-height: 100vh; }
    a { color: var(--brand-light); text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    [hidden] { display: none !important; }

    .layout { display: flex; height: 100vh; }
    aside.sidebar { width: var(--sidebar-w); flex: 0 0 auto; background: var(--bg-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { display: flex; align-items: baseline; gap: 8px; padding: 16px; border-bottom: 1px solid var(--border); }
    .brand { font-family: "Orbitron", sans-serif; font-size: 1.15rem; color: var(--brand-light); }
    .label { font-family: "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 1px; font-size: 0.6rem; color: var(--fg-dim); }
    .sidebar nav { display: flex; flex-direction: column; gap: 4px; padding: 12px; flex: 1; }
    .nav-item { display: flex; align-items: center; padding: 8px 12px; border-radius: 8px; color: var(--fg-dim); transition: background 0.15s, color 0.15s; border: none; background: transparent; width: 100%; text-align: left; }
    .nav-item:hover { background: var(--card-hover); color: var(--fg); }
    .nav-item.active { background: var(--brand); color: var(--fg); }
    .nav-item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--brand-light); }
    .nav-item.sub { font-size: 0.86rem; padding-left: 22px; }
    .nav-group { font-family: "JetBrains Mono", monospace; font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); padding: 10px 12px 2px; }
    .table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    .table th { text-align: left; color: var(--fg-dim); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); }
    .table td { padding: 5px 8px; border-bottom: 1px solid var(--border); }
    .table tbody tr:hover { background: var(--card-hover); }

    .lang-switch { display: flex; gap: 4px; padding: 12px; border-top: 1px solid var(--border); }
    .lang-btn { flex: 1; padding: 6px; border: 1px solid var(--border); background: transparent; color: var(--fg-dim); border-radius: 6px; font-size: 0.75rem; }
    .lang-btn.active { background: var(--brand); color: var(--fg); border-color: var(--brand); }

    main { flex: 1; overflow-y: auto; padding: 24px 32px; }
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-family: "Orbitron", sans-serif; font-size: 1.5rem; margin: 0 0 4px 0; }
    .page-header p { color: var(--fg-dim); margin: 0; }

    .banner { background: var(--card); border: 1px solid var(--border-bright); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 0.85rem; color: var(--fg-dim); }
    .banner strong { color: var(--fg); }
    .banner.warn { border-color: var(--warning); color: var(--warning); }
    .banner code { font-family: "JetBrains Mono", monospace; background: var(--bg-2); padding: 1px 6px; border-radius: 4px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-card); margin-bottom: 16px; }
    .card-title { font-family: "Orbitron", sans-serif; font-size: 1.05rem; margin: 0 0 14px 0; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .kpi { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
    .kpi-value { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 1.4rem; margin-top: 4px; }
    .kpi-value.info { color: var(--info); }

    .form { display: flex; flex-direction: column; gap: 10px; }
    .input, select, textarea { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--fg); font: inherit; width: 100%; }
    .input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand-light); box-shadow: 0 0 0 2px var(--border-bright); }

    .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; border: none; padding: 8px 14px; font-weight: 500; transition: background 0.15s, opacity 0.15s, color 0.15s; }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--brand-light); }
    .btn.primary { background: var(--brand); color: var(--fg); }
    .btn.primary:hover { background: var(--brand-light); }
    .btn.secondary { background: var(--bg-2); color: var(--fg); border: 1px solid var(--border); }
    .btn.secondary:hover { background: var(--card-hover); }
    .btn.ghost { background: transparent; color: var(--fg-dim); }
    .btn.ghost:hover { background: var(--card-hover); color: var(--fg); }
    .btn.danger { background: var(--danger); color: var(--fg); }
    .btn.danger:hover { opacity: 0.85; }

    .error, .success { margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: var(--bg-2); font-size: 0.85rem; white-space: pre-wrap; }
    .error { border: 1px solid var(--danger); color: var(--danger); }
    .success { border: 1px solid var(--success); color: var(--success); }

    .badge { display: inline-flex; align-items: center; padding: 1px 8px; border: 1px solid var(--border); border-radius: 4px; font-family: "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 1px; font-size: 0.6rem; }
    .badge.ok    { color: var(--success); border-color: var(--success); }
    .badge.warn  { color: var(--warning); border-color: var(--warning); }
    .badge.off   { color: var(--fg-dim); border-color: var(--border); }

    .llm-status { display: flex; align-items: center; gap: 6px; padding: 8px 12px; font-family: "JetBrains Mono", monospace; font-size: 0.62rem; letter-spacing: 1px; color: var(--fg-dim); text-transform: uppercase; border-bottom: 1px solid var(--border); }

    /* Switch on/off (toggle non destructif - pas de double-clic) */
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; }
    .switch { position: relative; display: inline-block; width: 42px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .track { position: absolute; cursor: pointer; inset: 0; background: var(--bg-3); border: 1px solid var(--border); border-radius: 24px; transition: background 0.15s, border-color 0.15s; }
    .switch .track::before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px; background: var(--fg-dim); border-radius: 50%; transition: transform 0.15s, background 0.15s; }
    .switch input:checked + .track { background: var(--brand); border-color: var(--brand); }
    .switch input:checked + .track::before { transform: translateX(18px); background: var(--fg); }
    .switch input:focus-visible + .track { box-shadow: 0 0 0 2px var(--brand-light); }

    .empty-state { text-align: center; color: var(--fg-dim); padding: 24px; }

    /* Architecture */
    .arch-flow { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .arch-step { display: flex; gap: 10px; padding: 8px 12px; background: var(--bg-2); border-left: 3px solid var(--brand); border-radius: 4px; font-size: 0.9rem; }
    .arch-step .step-n { color: var(--brand-light); font-family: "JetBrains Mono", monospace; font-weight: 700; flex-shrink: 0; }
    .arch-split { padding: 12px 14px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; }
    .arch-split .label.brand-color { color: var(--brand-light); margin-bottom: 6px; }
    .arch-split .label.accent-color { color: var(--success); margin-bottom: 6px; }
    .arch-split code { background: var(--bg-3); padding: 1px 5px; border-radius: 3px; font-family: "JetBrains Mono", monospace; font-size: 0.8rem; }

    /* Tree + suggestions metier */
    .badge.danger { color: var(--danger); border-color: var(--danger); }
    .badge.info   { color: var(--info); border-color: var(--info); }
    .tree { font-family: "JetBrains Mono", monospace; font-size: 0.82rem; max-height: 420px; overflow-y: auto; }
    .tree ul { list-style: none; margin: 0; padding-left: 16px; border-left: 1px solid var(--border); }
    .tree > ul { padding-left: 0; border-left: none; }
    .tree li { padding: 2px 0; }
    .tree .node-folder { color: var(--brand-light); }
    .tree .node-file { color: var(--fg-dim); }
    .tree .node-size { color: var(--fg-muted); font-size: 0.72rem; margin-left: 6px; }
    .dropzone { border: 1px dashed var(--border-bright); border-radius: 8px; padding: 18px; text-align: center; color: var(--fg-dim); }
    .sugg-list { display: flex; flex-direction: column; gap: 8px; }
    .sugg { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .sugg.accepted { border-color: var(--success); }
    .sugg.rejected { opacity: 0.55; }
    .sugg .paths { font-family: "JetBrains Mono", monospace; font-size: 0.8rem; word-break: break-all; }
    .sugg .paths .arrow { color: var(--brand-light); }
    .sugg .why { color: var(--fg-dim); font-size: 0.8rem; margin-top: 4px; }
    .sugg .acts { margin-top: 8px; display: flex; gap: 6px; }
    .stream-out { font-family: "JetBrains Mono", monospace; font-size: 0.8rem; white-space: pre-wrap; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; max-height: 220px; overflow-y: auto; }
    .btn.small { padding: 4px 10px; font-size: 0.78rem; }
    .color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 8px 0 14px; }
    .color-tile { border-radius: 6px; padding: 8px 10px; overflow: hidden; }
    .color-tile .ct-name { font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .color-tile .ct-why { font-size: 0.7rem; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="brand">Catia Toolbox</span><span class="label">v0.1</span>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <svg class="theme-toggle-sun" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg class="theme-toggle-moon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
      <div class="llm-status" id="llmStatus" title="Etat du LLM (voir Parametres)">
        LLM <span class="badge" id="llmBadge">...</span>
      </div>
      <nav>
        <button type="button" class="nav-item active" data-route="home">Home</button>

        <div class="nav-group">1 - Identification</div>
        <button type="button" class="nav-item sub" data-route="identification">Nomenclature / DE</button>
        <button type="button" class="nav-item sub" data-route="import">Source (scan / selection)</button>
        <button type="button" class="nav-item sub" data-route="diff">Comparaison</button>

        <div class="nav-group">2 - Preparation</div>
        <button type="button" class="nav-item sub" data-route="conversion">Conversion -&gt; Composer</button>

        <div class="nav-group">3 - Traitement</div>
        <button type="button" class="nav-item sub" data-route="smgxmlRecolor">SMGXML : couleur</button>
        <button type="button" class="nav-item sub" data-route="colorization">Colorisation (plan)</button>
        <button type="button" class="nav-item sub" data-route="tree">Arborescence</button>
        <button type="button" class="nav-item sub" data-route="suggestions">Optimisation</button>
        <button type="button" class="nav-item sub" data-route="export">Export plan</button>

        <div class="nav-group">4 - Integration</div>
        <button type="button" class="nav-item sub" data-route="smgxmlRename">SMGXML : renommage</button>
        <button type="button" class="nav-item sub" data-route="replacement">Remplacement (plan)</button>

        <div class="nav-group">5 - Controle</div>
        <button type="button" class="nav-item sub" data-route="qc">Checklist QC</button>
        <button type="button" class="nav-item sub" data-route="checks">Verifications auto</button>

        <div class="nav-group">Outils</div>
        <button type="button" class="nav-item sub" data-route="architecture">Architecture</button>
        <button type="button" class="nav-item sub" data-route="data">Donnees</button>
        <button type="button" class="nav-item sub" data-route="settings">Parametres</button>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="lang-btn active" data-lang="fr">FR</button>
        <button class="lang-btn"        data-lang="en">EN</button>
      </div>
    </aside>

    <main>
      <div class="page-header">
        <h1 id="pageTitle">Home</h1>
        <p id="pageSub"></p>
      </div>
      <div id="content"></div>
    </main>
  </div>

  <script type="application/json" id="i18n-fr">/*__I18N_FR__*/</script>

  <script>
    const API = "/api/v1";

    const routes = {
      home: { title: "Home", sub: "Optimisation d arborescence CATIA a partir de donnees exportees.", render: renderHome },
      identification: { title: "1 - Identification", sub: "Lire la nomenclature (.xlsm) et les donnees d entree (.zip) pour identifier les CATPart a traiter.", render: renderIdentification },
      smgxmlRecolor: { title: "3 - SMGXML : couleur", sub: "Appliquer la couleur des SIN mono-couleur dans le SMGXML (dry-run par defaut).", render: renderSmgxmlRecolor },
      smgxmlRename: { title: "4 - SMGXML : renommage", sub: "Remplacer le nom de l ancienne piece par la nouvelle dans le SMGXML (dry-run par defaut).", render: renderSmgxmlRename },
      qc: { title: "5 - Controle Qualite", sub: "Checklist de verification des pieces dans l assemblage.", render: renderQc },
      import: { title: "Import", sub: "Scanner un dossier local ou importer un listing CSV / JSON.", render: renderImport },
      tree: { title: "Arborescence", sub: "Metriques et structure de l import courant.", render: renderTree },
      suggestions: { title: "Suggestions", sub: "Generer un plan de reorganisation puis accepter / rejeter.", render: renderSuggestions },
      export: { title: "Export", sub: "Telecharger le plan (CSV) et le script relisable (.bat / .sh).", render: renderExport },
      diff: { title: "Comparaison", sub: "Detecter les pieces ajoutees / supprimees / modifiees entre deux imports.", render: renderDiff },
      checks: { title: "Verifications", sub: "Lancer des verifications configurables sur l import courant.", render: renderChecks },
      conversion: { title: "Conversion", sub: "Plan de conversion CATIA 3D vers Composer (dry-run).", render: renderConversion },
      replacement: { title: "Remplacement", sub: "Plan de remplacement de pieces a partir d un mapping.", render: renderReplacement },
      colorization: { title: "Colorisation", sub: "Attribuer une couleur aux pieces (par etat / type / profondeur).", render: renderColorization },
      architecture: { title: "Architecture", sub: "Backend, frontend et workflow utilisateur.", render: renderArchitecture },
      data: { title: "Donnees", sub: "Vue d ensemble et operations de reset.", render: renderData },
      settings: { title: "Parametres", sub: "Cle API Mistral et modeles utilises.", render: renderSettings },
    };

    // Etat partage entre onglets (import courant + run courant).
    const state = {
      get importId() { try { return localStorage.getItem("cto-import"); } catch (e) { return null; } },
      set importId(v) { try { v ? localStorage.setItem("cto-import", v) : localStorage.removeItem("cto-import"); } catch (e) { /* ignore */ } },
      get runId() { try { return localStorage.getItem("cto-run"); } catch (e) { return null; } },
      set runId(v) { try { v ? localStorage.setItem("cto-run", v) : localStorage.removeItem("cto-run"); } catch (e) { /* ignore */ } },
    };

    document.querySelectorAll(".nav-item").forEach((btn) => {
      btn.addEventListener("click", () => navigate(btn.dataset.route));
    });

    document.getElementById("themeToggle").addEventListener("click", () => {
      const root = document.documentElement;
      const isDark = root.classList.contains("dark");
      root.classList.toggle("dark", !isDark);
      try { localStorage.setItem("theme", isDark ? "light" : "dark"); } catch (e) { /* ignore */ }
    });

    function navigate(route) {
      document.querySelectorAll(".nav-item").forEach((b) => {
        b.classList.toggle("active", b.dataset.route === route);
      });
      const cfg = routes[route] || routes.home;
      document.getElementById("pageTitle").textContent = cfg.title;
      document.getElementById("pageSub").textContent = cfg.sub || "";
      cfg.render();
    }

    async function apiRequest(path, options) {
      const res = await fetch(API + path, options);
      if (res.status === 204) return null;
      const text = await res.text();
      let body = null;
      try { body = text ? JSON.parse(text) : null; } catch (e) { /* not json */ }
      if (!res.ok) {
        const msg = body && body.message ? body.message : (res.statusText || "Erreur");
        const err = new Error(msg);
        err.code = body && body.code;
        throw err;
      }
      return body;
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function showFeedback(node, kind, msg) {
      node.innerHTML = '<div class="' + kind + '">' + escapeHtml(msg) + '</div>';
    }

    // ---- Home -----------------------------------------------------------
    async function renderHome() {
      const health = await apiRequest("/health").catch(() => null);
      const content = document.getElementById("content");
      content.innerHTML = `
        <div class="card">
          <h2 class="card-title">Optimiser une arborescence CATIA</h2>
          <p>Ce POC reorganise une structure de fichiers CATIA <strong>desorganisee</strong> a partir
          de donnees <strong>exportees</strong> (aucun CATIA requis). Il produit un <strong>plan</strong>
          relisable - il ne deplace, renomme ou supprime <strong>jamais</strong> vos fichiers.</p>
          <div class="arch-flow">
            <div class="arch-step"><span class="step-n">1.</span><span>Onglet <strong>Import</strong> : scanner un dossier local (metadonnees seules) ou importer un listing CSV / JSON.</span></div>
            <div class="arch-step"><span class="step-n">2.</span><span>Onglet <strong>Arborescence</strong> : metriques (profondeur, fan-out, doublons, nommage).</span></div>
            <div class="arch-step"><span class="step-n">3.</span><span>Onglet <strong>Suggestions</strong> : generer le plan (heuristiques + Mistral), accepter / rejeter.</span></div>
            <div class="arch-step"><span class="step-n">4.</span><span>Onglet <strong>Export</strong> : telecharger le plan CSV et le script <code>.bat</code> / <code>.sh</code> a executer vous-meme.</span></div>
          </div>
          <div class="banner" style="margin-top:14px">
            Statut backend : ${health ? '<span class="badge ok">' + escapeHtml(health.status) + '</span>' : '<span class="badge warn">INCONNU</span>'}
            ${health ? ' &middot; LLM : <span class="' + llmBadgeClass(health.llm) + '">' + escapeHtml(health.llm) + '</span>' : ''}
            ${health ? ' &middot; version : <code>' + escapeHtml(health.version) + '</code>' : ''}
          </div>
        </div>
      `;
    }

    // ---- Architecture ---------------------------------------------------
    function renderArchitecture() {
      const content = document.getElementById("content");
      content.innerHTML = `
        <div class="card">
          <h2 class="card-title">Backend &harr; Frontend en 30 secondes</h2>
          <div class="grid-2">
            <div class="arch-split">
              <div class="label brand-color">BACKEND</div>
              <div>
                Python 3.11+ &middot; FastAPI sous <code>/api/v1/</code> &middot; Pydantic v2 &middot;
                SQLAlchemy 2 + SQLite + Alembic &middot; <code>structlog</code> JSON +
                <code>X-Request-Id</code>. Mistral via <code>httpx</code> async (chat
                streaming SSE) + sync (embeddings). Pas de SDK Mistral.
              </div>
            </div>
            <div class="arch-split">
              <div class="label accent-color">FRONTEND</div>
              <div>
                Preview HTML autonome embarque dans le backend (vanilla JS, sans Node) &mdash;
                consomme l API REST directement. Build React + Vite optionnel
                (TS strict, Tailwind, RHF + Zod, i18next, Zustand, TanStack Query)
                avec <code>@internal/ui</code> et <code>@internal/design-tokens</code>.
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">Workflow utilisateur (a adapter par POC)</h2>
          <div class="arch-flow">
            <div class="arch-step"><span class="step-n">1.</span><span>Onglet <strong>Parametres</strong> &rarr; renseigner la cle Mistral (stockee en SQLite, table <code>app_config</code>).</span></div>
            <div class="arch-step"><span class="step-n">2.</span><span>Tester la connexion - liste les modeles Mistral disponibles.</span></div>

    // ---- SSE (fetch + ReadableStream ; EventSource ne sait pas POST) -----
    async function streamSSE(path, body, handlers) {
      const res = await fetch(API + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      if (!res.ok || !res.body) {
        const txt = await res.text().catch(() => "");
        throw new Error("Echec stream (" + res.status + ") " + txt);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");
        let idx;
        while ((idx = buf.indexOf("\n\n")) !== -1) {
          const frame = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          let event = "message";
          let data = "";
          frame.split("\n").forEach((line) => {
            if (line.startsWith("event:")) event = line.slice(6).trim();
            else if (line.startsWith("data:")) data += line.slice(5).replace(/^ /, "");
          });
          if (handlers[event]) handlers[event](data);
        }
      }
    }

    // ---- Import ---------------------------------------------------------
    // Etat du navigateur OneDrive (input). Selection accumulee par chemin absolu.
    const browseState = { path: "", absPath: "", root: "", entries: [], recursive: false, allFiles: [], filter: "", selection: new Set() };

    function browseParent(absPath, root) {
      const norm = String(absPath || "").replace(/\\/g, "/").replace(/\/+$/, "");
      const rootNorm = String(root || "").replace(/\\/g, "/").replace(/\/+$/, "");
      if (!norm || norm === rootNorm) return "";
      const idx = norm.lastIndexOf("/");
      const parent = idx > 0 ? norm.slice(0, idx) : "";
      if (parent.length < rootNorm.length) return rootNorm;
      return parent;
    }

    // Case de selection stylee (visible en dark).
    function odCheck(path, sel) {

        + (sel ? "var(--brand)" : "var(--border)") + ";background:" + (sel ? "var(--brand)" : "var(--bg-3)")
        + ';color:var(--fg)">' + (sel ? "&#10003;" : "") + "</span>";
    }

    function odBg(sel) {
      return 'style="align-items:center;gap:8px;padding:4px 6px;border-radius:6px;background:' + (sel ? "var(--bg-3)" : "transparent") + '"';
    }

    // Vue niveau : dossier (cliquer le nom = ouvrir, la case = selectionner) ou fichier.
    function odRowHtml(e) {
      const sel = browseState.selection.has(e.path);
      const isFolder = e.kind === "folder";
      const name = isFolder
        ? '<button data-open="' + escapeHtml(e.path) + '" class="node-folder" title="Ouvrir" style="flex:1;background:none;border:none;padding:0;text-align:left;cursor:pointer;font:inherit">' + escapeHtml(e.name) + "/</button>"

      const meta = isFolder ? '<span class="badge">dossier</span>' : '<span class="node-size">' + fmtBytes(e.size) + "</span>";
      return '<div class="row" ' + odBg(sel) + ">" + odCheck(e.path, sel) + name + meta + "</div>";
    }

    // Vue recursive : un fichier (chemin relatif affiche).
    function odFileRowHtml(e) {
      const sel = browseState.selection.has(e.path);
      const label = '<span data-toggle="' + escapeHtml(e.path) + '" class="node-file" style="flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(e.rel || e.name) + "</span>";

      return '<div class="row" ' + odBg(sel) + ">" + odCheck(e.path, sel) + label + meta + "</div>";
    }

    function odVisibleItems() {

        const f = browseState.filter.trim().toLowerCase();
        return browseState.allFiles.filter((e) => !f || (e.rel || e.name).toLowerCase().indexOf(f) !== -1);
      }
      return browseState.entries;
    }

    async function odClick(ev) {

      const tog = ev.target.closest("[data-toggle]");

        browseState.recursive = false;

        if (browseState.recursive) { browseState.recursive = false; renderBrowser(); }

      if (ev.target.closest("#odSelectAll")) {
        odVisibleItems().forEach((e) => browseState.selection.add(e.path));
        odPaint();
        return;

      if (ev.target.closest("#odClearSel")) { browseState.selection.clear(); odPaint(); return; }

    // ---- Arborescence ---------------------------------------------------
    function treeHtml(nodes) {
      if (!nodes || !nodes.length) return "";
      return "<ul>" + nodes.map((n) => {
        const cls = n.kind === "folder" ? "node-folder" : "node-file";
        const size = n.kind === "file" ? '<span class="node-size">' + fmtBytes(n.size) + "</span>" : "";
        return '<li><span class="' + cls + '">' + escapeHtml(n.name) + "</span>" + size + treeHtml(n.children) + "</li>";
      }).join("") + "</ul>";
    }

    async function renderTree() {
      const content = document.getElementById("content");
      if (!state.importId) { content.innerHTML = '<div class="empty-state">Aucun import courant. Allez dans l onglet Import.</div>'; return; }

      try { data = await apiRequest("/imports/" + state.importId + "/tree"); }

        try {
          await streamSSE("/imports/" + state.importId + "/optimize", body, {
            session: (d) => { try { state.runId = JSON.parse(d).run_id; } catch (e) { /* ignore */ } },
            token: (d) => { out.textContent += d; out.scrollTop = out.scrollHeight; },
            done: () => { showFeedback(fb, "success", "Plan genere."); loadSuggestions(); },

    async function setStatus(id, status) {

      if (!ids.length) return;

    }

    // ---- Selecteur de fichier reutilisable (navigue la Source, filtre par ext) ----
    const pickerState = {};  // panelId -> { path, root, absPath, exts, target }

    async function pickerLoad(panelId) {
      const st = pickerState[panelId];
      const panel = document.getElementById(panelId);
      if (!panel || !st) return;
      let data;
      try {
        data = await apiRequest("/browse/list", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ scope: "input", path: st.path }),
        });
      } catch (e) { panel.innerHTML = '<div class="empty-state">' + escapeHtml(e.message) + " (configurez la racine Source dans Parametres)</div>"; return; }
      st.root = data.root; st.absPath = data.path;
      const atRoot = data.path === data.root;
      const items = (data.entries || []).filter((e) =>
        e.kind === "folder" || !st.exts.length || st.exts.some((x) => e.name.toLowerCase().endsWith(x))
      );
      const rows = items.map((e) => e.kind === "folder"
        ? '<div class="row" style="gap:6px;padding:3px 4px;align-items:center"><button class="btn ghost small" data-pkopen="' + escapeHtml(e.path) + '">Ouvrir</button><span class="node-folder grow">' + escapeHtml(e.name) + "/</span></div>"
        : '<div class="row" style="gap:6px;padding:3px 4px;align-items:center"><button class="btn secondary small" data-pkfile="' + escapeHtml(e.path) + '">Choisir</button><span class="node-file grow">' + escapeHtml(e.name) + "</span><span class=\"node-size\">" + fmtBytes(e.size) + "</span></div>"
      ).join("");
      panel.innerHTML = '<div class="row" style="gap:6px;margin-bottom:6px;align-items:center"><button class="btn ghost small" id="' + panelId + '_up" ' + (atRoot ? "disabled" : "") + '>Remonter</button><code class="grow" style="overflow:hidden;text-overflow:ellipsis">' + escapeHtml(data.path) + "</code></div>"
        + '<div style="max-height:240px;overflow:auto">' + (rows || '<div class="empty-state">Aucun element' + (st.exts.length ? " (" + st.exts.join(", ") + ")" : "") + " ici.</div>") + "</div>";
      panel.onclick = function (ev) {
        const op = ev.target.closest("[data-pkopen]");
        if (op) { st.path = op.dataset.pkopen; pickerLoad(panelId); return; }
        const f = ev.target.closest("[data-pkfile]");
        if (f) {
          const inp = document.getElementById(st.target);
          if (inp) inp.value = f.dataset.pkfile;
          panel.style.display = "none";
          return;
        }
        if (ev.target.closest("#" + panelId + "_up")) { st.path = browseParent(st.absPath, st.root); pickerLoad(panelId); return; }
      };
    }

    function setupPicker(toggleId, panelId, targetId, exts) {
      pickerState[panelId] = { path: "", root: "", absPath: "", exts: exts || [], target: targetId };
      const btn = document.getElementById(toggleId);
      const panel = document.getElementById(panelId);
      if (!btn || !panel) return;
      btn.addEventListener("click", () => {
        if (panel.style.display !== "block") { panel.style.display = "block"; pickerState[panelId].path = ""; pickerLoad(panelId); }
        else { panel.style.display = "none"; }
      });
    }

    function parseRenameMap(text) {
      const out = [];
      (text || "").split(/\n/).forEach((line) => {
        const m = line.split(/=|;/);
        if (m.length >= 2 && m[0].trim() && m[1].trim()) out.push({ old: m[0].trim(), new: m.slice(1).join("=").trim() });
      });
      return out;
    }

    function bindSmgxmlAction(operation) {
      setupPicker("smgBrowse", "smgPicker", "smgPath", [".smgxml", ".smg", ".xml"]);
      const btn = document.getElementById("smgBtn");
      let armed = false, timer = null;
      btn.addEventListener("click", async () => {
        const fb = document.getElementById("smgFeedback");
        const path = document.getElementById("smgPath").value.trim();
        if (!path) { showFeedback(fb, "error", "Renseignez le chemin du SMGXML."); return; }
        const apply = document.getElementById("smgApply").checked;
        let body = { scope: "input", path, apply };
        if (operation === "recolor") {
          const nomen = document.getElementById("smgNomen").value;
          if (!nomen) { showFeedback(fb, "error", "Choisissez une nomenclature."); return; }
          body.nomenclature_run_id = nomen;
          body.match_by = document.getElementById("smgMatch").value;
        } else {
          const mapping = parseRenameMap(document.getElementById("smgMap").value);
          if (!mapping.length) { showFeedback(fb, "error", "Ajoutez au moins une correspondance ancien=nouveau."); return; }
          body.mapping = mapping;
        }
        // Ecriture = action a confirmer (double-clic).
        if (apply && !armed) {
          armed = true; btn.textContent = "Cliquer encore pour ecrire";
          timer = setTimeout(() => { armed = false; btn.textContent = "Lancer"; }, 3000);
          return;
        }
        clearTimeout(timer); armed = false; btn.textContent = "Lancer";
        try {
          const run = await apiRequest("/smgxml/" + operation, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          showFeedback(fb, "success", run.applied ? "Applique (" + run.summary.changes + " changements)." : "Dry-run : " + run.summary.changes + " changement(s).");
          showSmgxmlResult("smgResult", run);
        } catch (e) { showFeedback(fb, "error", e.message); }
      });
    }

          </div>
          ${lists.length ? '<div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">' + lists.map((c) =>
            '<button class="btn secondary small" data-qcopen="' + c.id + '">' + escapeHtml(c.title) + " (" + c.summary.done + "/" + c.summary.total + ")</button>"
            + '<button class="btn danger small" data-qcdel="' + c.id + '">x</button>').join("") + "</div>" : ""}
        </div>
        <div id="qcDetail"></div>
      `;
      document.getElementById("qcNew").addEventListener("click", async () => {
        try {
          const cl = await apiRequest("/qc/checklists", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ title: document.getElementById("qcTitle").value.trim(), template: "assembly" }) });
          renderQc();
          setTimeout(() => loadQc(cl.id), 100);
        } catch (e) { /* ignore */ }
      });
      content.querySelectorAll("[data-qcopen]").forEach((b) => b.addEventListener("click", () => loadQc(b.dataset.qcopen)));
      content.querySelectorAll("[data-qcdel]").forEach((b) => b.addEventListener("click", async () => {
        try { await apiRequest("/qc/checklists/" + b.dataset.qcdel, { method: "DELETE" }); renderQc(); } catch (e) { /* ignore */ }
      }));
      if (lists.length) loadQc(lists[0].id);
    }

    // ---- Indicateur global LLM (sidebar) --------------------------------
    function llmBadgeClass(state) {
      if (state === "ok") return "badge ok";
      if (state === "disabled") return "badge off";
      return "badge warn"; // not_configured / inconnu
    }
    function llmBadgeLabel(state) {
      if (state === "ok") return "ON";
      if (state === "disabled") return "OFF";
      if (state === "not_configured") return "NO KEY";
      return "?";
    }
    async function refreshLlmStatus() {
      const health = await apiRequest("/health").catch(() => null);
      const badge = document.getElementById("llmBadge");
      if (!badge) return;
      const state = health ? health.llm : "?";
      badge.className = llmBadgeClass(state);
      badge.textContent = llmBadgeLabel(state);
    }

    // Bootstrap
    refreshLlmStatus();
    navigate("home");
  </script>
</body>
</html>
