[project]
name = "image-processor-lama-service"
version = "0.1.0"
description = "Local LaMa inpainting service for Image Processor"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "simple-lama-inpainting==0.1.2",
    "truststore>=0.10",
    "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
