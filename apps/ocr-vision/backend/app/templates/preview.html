<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>OCR Vision</title>
  <script>
    (function () {
      var stored = localStorage.getItem("theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (stored === "dark" || (!stored && prefersDark) || stored === null) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700&display=swap" />
  <style>
    /*__CSS_VARS__*/

    .theme-toggle { display: inline-flex; align-items: center; justify-content: center; margin-left: auto; width: 28px; height: 28px; padding: 0; border: none; background: transparent; color: var(--fg-dim); border-radius: 6px; cursor: pointer; transition: background 0.15s, color 0.15s; }
    .theme-toggle:hover { background: var(--card-hover); color: var(--fg); }
    .theme-toggle:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--brand-light); }
    .theme-toggle-sun { display: none; }
    .theme-toggle-moon { display: block; }
    .dark .theme-toggle-sun { display: block; }
    .dark .theme-toggle-moon { display: none; }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { font-size: 13.5px; }
    body { font-family: "Inter", sans-serif; line-height: 1.5; background: var(--bg); color: var(--fg); min-height: 100vh; }
    a { color: var(--brand-light); text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    [hidden] { display: none !important; }

    .layout { display: flex; height: 100vh; }
    aside.sidebar { width: var(--sidebar-w); flex: 0 0 auto; background: var(--bg-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { display: flex; align-items: baseline; gap: 8px; padding: 16px; border-bottom: 1px solid var(--border); }
    .brand { font-family: "Orbitron", sans-serif; font-size: 1.15rem; color: var(--brand-light); }
    .label { font-family: "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 1px; font-size: 0.6rem; color: var(--fg-dim); }
    .sidebar nav { display: flex; flex-direction: column; gap: 4px; padding: 12px; flex: 1; }
    .nav-item { display: flex; align-items: center; padding: 8px 12px; border-radius: 8px; color: var(--fg-dim); transition: background 0.15s, color 0.15s; border: none; background: transparent; width: 100%; text-align: left; }
    .nav-item:hover { background: var(--card-hover); color: var(--fg); }
    .nav-item.active { background: var(--brand); color: var(--fg); }
    .nav-item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--brand-light); }

    .lang-switch { display: flex; gap: 4px; padding: 12px; border-top: 1px solid var(--border); }
    .lang-btn { flex: 1; padding: 6px; border: 1px solid var(--border); background: transparent; color: var(--fg-dim); border-radius: 6px; font-size: 0.75rem; }
    .lang-btn.active { background: var(--brand); color: var(--fg); border-color: var(--brand); }

    main { flex: 1; overflow-y: auto; padding: 24px 32px; }
    .page-header { margin-bottom: 24px; }
    .page-header h1 { font-family: "Orbitron", sans-serif; font-size: 1.5rem; margin: 0 0 4px 0; }
    .page-header p { color: var(--fg-dim); margin: 0; }

    .banner { background: var(--card); border: 1px solid var(--border-bright); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 0.85rem; color: var(--fg-dim); }
    .banner strong { color: var(--fg); }
    .banner.warn { border-color: var(--warning); color: var(--warning); }
    .banner code { font-family: "JetBrains Mono", monospace; background: var(--bg-2); padding: 1px 6px; border-radius: 4px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-card); margin-bottom: 16px; }
    .card-title { font-family: "Orbitron", sans-serif; font-size: 1.05rem; margin: 0 0 14px 0; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .kpi { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
    .kpi-value { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 1.4rem; margin-top: 4px; }
    .kpi-value.info { color: var(--info); }

    .form { display: flex; flex-direction: column; gap: 10px; }
    .input, select, textarea { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; color: var(--fg); font: inherit; width: 100%; }
    .input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand-light); box-shadow: 0 0 0 2px var(--border-bright); }

    .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; border: none; padding: 8px 14px; font-weight: 500; transition: background 0.15s, opacity 0.15s, color 0.15s; }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--brand-light); }
    .btn.primary { background: var(--brand); color: var(--fg); }
    .btn.primary:hover { background: var(--brand-light); }
    .btn.secondary { background: var(--bg-2); color: var(--fg); border: 1px solid var(--border); }
    .btn.secondary:hover { background: var(--card-hover); }
    .btn.ghost { background: transparent; color: var(--fg-dim); }
    .btn.ghost:hover { background: var(--card-hover); color: var(--fg); }
    .btn.danger { background: var(--danger); color: var(--fg); }
    .btn.danger:hover { opacity: 0.85; }

    .error, .success { margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: var(--bg-2); font-size: 0.85rem; white-space: pre-wrap; }
    .error { border: 1px solid var(--danger); color: var(--danger); }
    .success { border: 1px solid var(--success); color: var(--success); }

    .badge { display: inline-flex; align-items: center; padding: 1px 8px; border: 1px solid var(--border); border-radius: 4px; font-family: "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 1px; font-size: 0.6rem; }
    .badge.ok    { color: var(--success); border-color: var(--success); }
    .badge.warn  { color: var(--warning); border-color: var(--warning); }

    .empty-state { text-align: center; color: var(--fg-dim); padding: 24px; }

    /* Architecture */
    .arch-flow { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .arch-step { display: flex; gap: 10px; padding: 8px 12px; background: var(--bg-2); border-left: 3px solid var(--brand); border-radius: 4px; font-size: 0.9rem; }
    .arch-step .step-n { color: var(--brand-light); font-family: "JetBrains Mono", monospace; font-weight: 700; flex-shrink: 0; }
    .arch-split { padding: 12px 14px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; }
    .arch-split .label.brand-color { color: var(--brand-light); margin-bottom: 6px; }
    .arch-split .label.accent-color { color: var(--success); margin-bottom: 6px; }
    .arch-split code { background: var(--bg-3); padding: 1px 5px; border-radius: 3px; font-family: "JetBrains Mono", monospace; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="brand">OCR Vision</span><span class="label">v0.1</span>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <svg class="theme-toggle-sun" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg class="theme-toggle-moon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
      <nav>
        <button type="button" class="nav-item active" data-route="ocr"          data-i18n="nav.ocr">OCR / Vision</button>
        <button type="button" class="nav-item"        data-route="home"         data-i18n="nav.home">Accueil</button>
        <button type="button" class="nav-item"        data-route="architecture" data-i18n="nav.architecture">Architecture</button>
        <button type="button" class="nav-item"        data-route="data"         data-i18n="nav.data">Donnees</button>
        <button type="button" class="nav-item"        data-route="settings"     data-i18n="nav.settings">Parametres</button>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="lang-btn active" data-lang="fr">FR</button>
        <button class="lang-btn"        data-lang="en">EN</button>
      </div>
    </aside>

    <main>
      <div class="page-header">
        <h1 id="pageTitle">Home</h1>
        <p id="pageSub"></p>
      </div>
      <div id="content"></div>
    </main>
  </div>

  <script type="application/json" id="i18n-fr">/*__I18N_FR__*/</script>
  <script type="application/json" id="i18n-en">/*__I18N_EN__*/</script>

  <script>
    const API = "/api/v1";
    const LANG_KEY = "ocr-vision-lang";

    const I18N = {
      fr: JSON.parse(document.getElementById("i18n-fr").textContent || "{}"),
      en: JSON.parse(document.getElementById("i18n-en").textContent || "{}"),
    };
    let LANG = "fr";
    try {
      const stored = localStorage.getItem(LANG_KEY);
      if (stored === "fr" || stored === "en") LANG = stored;
    } catch (e) { /* ignore */ }

    function t(key) {
      const parts = key.split(".");
      let node = I18N[LANG];
      for (const p of parts) {
        if (node && typeof node === "object" && p in node) node = node[p];
        else { node = undefined; break; }
      }
      if (typeof node === "string") return node;
      // Fallback FR
      node = I18N.fr;
      for (const p of parts) {
        if (node && typeof node === "object" && p in node) node = node[p];
        else return key;
      }
      return typeof node === "string" ? node : key;
    }

    function applyStaticI18n() {
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.dataset.i18n);
      });
      document.documentElement.setAttribute("lang", LANG);
    }

    function setLang(lang) {
      if (lang !== "fr" && lang !== "en") return;
      LANG = lang;
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* ignore */ }
      document.querySelectorAll(".lang-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.lang === lang);
      });
      applyStaticI18n();
      // Re-render la page active
      const active = document.querySelector(".nav-item.active");
      navigate(active ? active.dataset.route : "ocr");
    }

    const routes = {
      ocr:          { titleKey: "routes.ocr.title",          subKey: "routes.ocr.sub",          render: renderOcr },
      home:         { titleKey: "routes.home.title",         subKey: "routes.home.sub",         render: renderHome },
      architecture: { titleKey: "routes.architecture.title", subKey: "routes.architecture.sub", render: renderArchitecture },
      data:         { titleKey: "routes.data.title",         subKey: "routes.data.sub",         render: renderData },
      settings:     { titleKey: "routes.settings.title",     subKey: "routes.settings.sub",     render: renderSettings },
    };

    document.querySelectorAll(".nav-item").forEach((btn) => {
      btn.addEventListener("click", () => navigate(btn.dataset.route));
    });

    document.querySelectorAll(".lang-btn").forEach((btn) => {
      btn.addEventListener("click", () => setLang(btn.dataset.lang));
    });

    document.getElementById("themeToggle").addEventListener("click", () => {
      const root = document.documentElement;
      const isDark = root.classList.contains("dark");
      root.classList.toggle("dark", !isDark);
      try { localStorage.setItem("theme", isDark ? "light" : "dark"); } catch (e) { /* ignore */ }
    });

    function navigate(route) {
      document.querySelectorAll(".nav-item").forEach((b) => {
        b.classList.toggle("active", b.dataset.route === route);
      });
      const cfg = routes[route] || routes.home;
      document.getElementById("pageTitle").textContent = t(cfg.titleKey);
      document.getElementById("pageSub").textContent = t(cfg.subKey);
      cfg.render();
    }

    async function apiRequest(path, options) {
      const res = await fetch(API + path, options);
      if (res.status === 204) return null;
      const text = await res.text();
      let body = null;
      try { body = text ? JSON.parse(text) : null; } catch (e) { /* not json */ }
      if (!res.ok) {
        const msg = body && body.message ? body.message : (res.statusText || "Erreur");
        const err = new Error(msg);
        err.code = body && body.code;
        throw err;
      }
      return body;
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function showFeedback(node, kind, msg) {
      node.innerHTML = '<div class="' + kind + '">' + escapeHtml(msg) + '</div>';
    }

    // ---- OCR / Vision ---------------------------------------------------
    function renderOcr() {
      const c = document.getElementById("content");
      c.innerHTML =
        '<div class="card">'
        + '<div class="card-title">' + escapeHtml(t("ocr.card_title")) + '</div>'
        + '<div class="banner">' + escapeHtml(t("ocr.banner")) + '</div>'
        + '<input type="file" id="ocrFile" class="input" accept="image/*,.pdf" />'
        + '<div class="label" style="margin:10px 0 4px">' + escapeHtml(t("ocr.prompt_label")) + '</div>'
        + '<textarea id="ocrPrompt" class="input" rows="3" '
        + 'placeholder="' + escapeHtml(t("ocr.prompt_placeholder")) + '"></textarea>'
        + '<div style="margin-top:10px">'
        + '<button type="button" class="btn primary" id="ocrRun">' + escapeHtml(t("ocr.run")) + '</button> '
        + '<span id="ocrMsg" class="label"></span></div>'
        + '<div id="ocrResult" style="margin-top:14px"></div>'
        + '</div>';
      document.getElementById("ocrRun").addEventListener("click", runOcr);
    }

    async function runOcr() {
      const inp = document.getElementById("ocrFile");
      const msg = document.getElementById("ocrMsg");
      const res = document.getElementById("ocrResult");
      if (!inp.files || !inp.files[0]) { msg.textContent = t("ocr.no_file"); return; }
      msg.textContent = t("ocr.running");
      res.innerHTML = "";
      const fd = new FormData();
      fd.append("file", inp.files[0]);
      const promptEl = document.getElementById("ocrPrompt");
      if (promptEl && promptEl.value.trim()) fd.append("prompt", promptEl.value.trim());
      try {
        const out = await apiRequest("/vision/test", { method: "POST", body: fd });
        msg.textContent = out.warning ? t("ocr.warning_prefix") + out.warning : "";
        res.innerHTML =
          '<div class="card-title">' + escapeHtml(t("ocr.ocr_result_title")) + '</div>'
          + '<pre style="white-space:pre-wrap">'
          + escapeHtml(out.ocr_text || t("ocr.ocr_empty")) + '</pre>'
          + '<div class="card-title" style="margin-top:12px">' + escapeHtml(t("ocr.desc_result_title")) + '</div>'
          + '<div>' + escapeHtml(out.description || t("ocr.desc_empty")) + '</div>';
      } catch (e) {
        msg.textContent = "";
        showFeedback(res, "error", e.message || t("common.error"));
      }
    }

    // ---- Home -----------------------------------------------------------
    async function renderHome() {
      const health = await apiRequest("/health").catch(() => null);
      const content = document.getElementById("content");
      content.innerHTML = `
        <div class="card">
          <h2 class="card-title">${escapeHtml(t("home.title"))}</h2>
          <p>${escapeHtml(t("home.body_intro"))}<code>frontend/dist/</code>${escapeHtml(t("home.body_dist"))}</p>
          <p>${escapeHtml(t("home.body_edit"))}</p>
          <ul>
            <li><code>backend/app/api/</code> &mdash; ${escapeHtml(t("home.edit_api"))}</li>
            <li><code>backend/app/db/models.py</code> &mdash; ${escapeHtml(t("home.edit_models"))}</li>
            <li><code>backend/app/templates/preview.html</code> &mdash; ${escapeHtml(t("home.edit_preview"))}</li>
            <li><code>scripts/package_&lt;poc&gt;.py</code> &mdash; ${escapeHtml(t("home.edit_package"))}</li>
          </ul>
          <div class="banner">
            ${escapeHtml(t("home.status_backend"))} : ${health ? '<span class="badge ok">' + escapeHtml(health.status) + '</span>' : '<span class="badge warn">' + escapeHtml(t("home.status_unknown")) + '</span>'}
            ${health ? ' &middot; ' + escapeHtml(t("home.status_llm")) + ' : <span class="badge">' + escapeHtml(health.llm) + '</span>' : ''}
            ${health ? ' &middot; ' + escapeHtml(t("home.status_version")) + ' : <code>' + escapeHtml(health.version) + '</code>' : ''}
          </div>
        </div>
      `;
    }

    // ---- Architecture ---------------------------------------------------
    function renderArchitecture() {
      const content = document.getElementById("content");
      content.innerHTML = `
        <div class="card">
          <h2 class="card-title">${escapeHtml(t("arch.title"))}</h2>
          <div class="grid-2">
            <div class="arch-split">
              <div class="label brand-color">BACKEND</div>
              <div>
                Python 3.11+ &middot; FastAPI sous <code>/api/v1/</code> &middot; Pydantic v2 &middot;
                SQLAlchemy 2 + SQLite + Alembic &middot; <code>structlog</code> JSON +
                <code>X-Request-Id</code>. Mistral via <code>httpx</code> async (chat
                streaming SSE) + sync (embeddings). Pas de SDK Mistral.
              </div>
            </div>
            <div class="arch-split">
              <div class="label accent-color">FRONTEND</div>
              <div>
                Preview HTML autonome embarque dans le backend (vanilla JS, sans Node) &mdash;
                consomme l API REST directement. Build React + Vite optionnel
                (TS strict, Tailwind, RHF + Zod, i18next, Zustand, TanStack Query)
                avec <code>@internal/ui</code> et <code>@internal/design-tokens</code>.
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <h2 class="card-title">${escapeHtml(t("arch.workflow_title"))}</h2>
          <div class="arch-flow">
            <div class="arch-step"><span class="step-n">1.</span><span>${escapeHtml(t("arch.step1"))}</span></div>
            <div class="arch-step"><span class="step-n">2.</span><span>${escapeHtml(t("arch.step2"))}</span></div>
            <div class="arch-step"><span class="step-n">3.</span><span>${escapeHtml(t("arch.step3"))}</span></div>
            <div class="arch-step"><span class="step-n">4.</span><span><em>${escapeHtml(t("arch.step4"))}</em></span></div>
          </div>
        </div>
      `;
    }

    // ---- Donnees --------------------------------------------------------
    async function renderData() {
      const stats = await apiRequest("/admin/stats").catch(() => null);
      const content = document.getElementById("content");
      const fmtSize = (n) => (n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " kB" : (n / 1048576).toFixed(2) + " MB");
      content.innerHTML = `
        <div class="card">
          <h2 class="card-title">${escapeHtml(t("data.overview"))}</h2>
          ${
            stats
              ? `<div class="kpi-grid">
                <div class="kpi"><div class="label">${escapeHtml(t("data.documents"))}</div><div class="kpi-value info">${stats.documents}</div></div>
                <div class="kpi"><div class="label">${escapeHtml(t("data.chunks"))}</div><div class="kpi-value info">${stats.chunks}</div></div>
                <div class="kpi"><div class="label">${escapeHtml(t("data.sessions"))}</div><div class="kpi-value info">${stats.sessions}</div></div>
                <div class="kpi"><div class="label">${escapeHtml(t("data.messages"))}</div><div class="kpi-value info">${stats.messages}</div></div>
                <div class="kpi"><div class="label">${escapeHtml(t("data.total_size"))}</div><div class="kpi-value">${fmtSize(stats.total_size_bytes)}</div></div>
              </div>`
              : `<div class="empty-state">${escapeHtml(t("data.stats_unavailable"))}</div>`
          }
        </div>

        <div class="card">
          <h2 class="card-title">${escapeHtml(t("data.reset_title"))}</h2>
          <div class="banner warn">${escapeHtml(t("data.reset_warning_prefix"))}<strong>${escapeHtml(t("data.reset_warning_strong"))}</strong>${escapeHtml(t("data.reset_warning_suffix"))}</div>
          <div class="row">
            <button class="btn danger" data-reset="all">${escapeHtml(t("data.reset_all"))}</button>
          </div>
          <div id="resetFeedback" style="margin-top: 12px;"></div>
        </div>
      `;

      // Double-clic pour confirmer (pas de confirm() natif, interdit par standard).
      document.querySelectorAll("[data-reset]").forEach((btn) => {
        let armed = false;
        let timer = null;
        const original = btn.textContent;
        btn.addEventListener("click", async () => {
          const scope = btn.dataset.reset;
          if (!armed) {
            armed = true;
            btn.textContent = t("data.confirm_again");
            timer = setTimeout(() => { armed = false; btn.textContent = original; }, 3000);
            return;
          }
          clearTimeout(timer);
          armed = false;
          btn.textContent = original;
          try {
            const r = await apiRequest("/admin/reset/" + scope, { method: "POST" });
            const items = Object.entries(r.deleted || {}).map(([k, v]) => k + ": " + v).join(", ") || t("data.reset_empty");
            showFeedback(document.getElementById("resetFeedback"), "success", t("data.reset_ok_prefix") + items + t("data.reset_ok_suffix"));
            setTimeout(() => renderData(), 800);
          } catch (e) { showFeedback(document.getElementById("resetFeedback"), "error", e.message); }
        });
      });
    }

    // ---- Settings -------------------------------------------------------
    async function renderSettings() {
      const cfg = await apiRequest("/settings").catch(() => null);
      const content = document.getElementById("content");
      content.innerHTML = `
        <div class="card">
          <h2 class="card-title">
            <span style="display:inline-flex;align-items:center;gap:10px">${escapeHtml(t("settings.title"))}
              ${cfg && cfg.api_key_set ? '<span class="badge ok">' + escapeHtml(t("settings.badge_configured")) + '</span>' : '<span class="badge warn">' + escapeHtml(t("settings.badge_not_configured")) + '</span>'}
            </span>
          </h2>
          <form id="settingsForm" class="form">
            <label>
              <div class="label">${escapeHtml(t("settings.api_key"))}</div>
              <input class="input" id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
              ${cfg && cfg.api_key_set ? '<small style="color:var(--fg-dim);font-size:0.78rem">' + escapeHtml(t("settings.api_key_existing")) + '</small>' : ""}
            </label>
            <label>
              <div class="label">${escapeHtml(t("settings.base_url"))}</div>
              <input class="input" id="baseUrl" type="url" value="${escapeHtml(cfg ? cfg.base_url : "https://api.mistral.ai")}" />
            </label>
            <div class="row">
              <label class="grow">
                <div class="label">${escapeHtml(t("settings.chat_model"))}</div>
                <input class="input" id="chatModel" type="text" value="${escapeHtml(cfg ? cfg.chat_model : "mistral-small-latest")}" />
              </label>
              <label class="grow">
                <div class="label">${escapeHtml(t("settings.embed_model"))}</div>
                <input class="input" id="embedModel" type="text" value="${escapeHtml(cfg ? cfg.embed_model : "mistral-embed")}" />
              </label>
              <label class="grow">
                <div class="label">${escapeHtml(t("settings.vision_model"))}</div>
                <input class="input" id="visionModel" type="text" value="${escapeHtml(cfg ? cfg.vision_model : "mistral-medium-latest")}" />
              </label>
            </div>
            <div class="row">
              <button class="btn primary" type="button" id="saveBtn">${escapeHtml(t("settings.save"))}</button>
              <button class="btn secondary" type="button" id="testBtn">${escapeHtml(t("settings.test"))}</button>
              <span id="settingsFeedback" class="grow"></span>
            </div>
          </form>
          <div id="modelsList" style="margin-top:12px"></div>
        </div>
      `;

      document.getElementById("saveBtn").addEventListener("click", async () => {
        const fb = document.getElementById("settingsFeedback");
        const payload = {
          base_url: document.getElementById("baseUrl").value,
          chat_model: document.getElementById("chatModel").value,
          embed_model: document.getElementById("embedModel").value,
          vision_model: document.getElementById("visionModel").value,
        };
        const apiKey = document.getElementById("apiKey").value;
        if (apiKey) payload.api_key = apiKey;
        try {
          await apiRequest("/settings", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          showFeedback(fb, "success", t("settings.saved"));
          setTimeout(renderSettings, 500);
        } catch (e) { showFeedback(fb, "error", e.message); }
      });

      document.getElementById("testBtn").addEventListener("click", async () => {
        const fb = document.getElementById("settingsFeedback");
        try {
          const r = await apiRequest("/settings/test", { method: "POST" });
          const ml = document.getElementById("modelsList");
          if (r.ok) {
            showFeedback(fb, "success", t("settings.connection_ok_prefix") + r.models.length + t("settings.connection_ok_suffix"));
            ml.innerHTML = '<div class="card-title">' + escapeHtml(t("settings.models_available")) + ' (' + r.models.length + ')</div>'
              + '<div>' + (r.models || []).map(function (m) {
                  return '<span class="badge" style="margin:2px">' + escapeHtml(m) + '</span>';
                }).join(" ") + '</div>';
          } else {
            showFeedback(fb, "error", t("settings.connection_ko_prefix") + (r.error || ""));
            ml.innerHTML = "";
          }
        } catch (e) { showFeedback(fb, "error", e.message); }
      });
    }

    // Bootstrap
    document.querySelectorAll(".lang-btn").forEach((b) => {
      b.classList.toggle("active", b.dataset.lang === LANG);
    });
    applyStaticI18n();
    navigate("ocr");
  </script>
</body>
</html>
