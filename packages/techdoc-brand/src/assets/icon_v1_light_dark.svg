<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 170" width="170" height="170">
  <style>
    /* Mode clair (par défaut) */
    .lg-bg   { fill: #f4f7fc; }
    .lg-link { stroke: #2a64c5; }
    .lg-hub  { fill: #2a64c5; }
    .lg-top  { fill: #001e60; }
    .lg-left { fill: #307fe2; }
    .lg-right{ fill: #20a0d3; }

    /* Mode sombre */
    @media (prefers-color-scheme: dark) {
      .lg-bg   { fill: #0f172a; }
      .lg-link { stroke: #5b8fe0; }
      .lg-hub  { fill: #5b8fe0; }
      .lg-top  { fill: #9cc2f4; }
      .lg-left { fill: #307fe2; }
      .lg-right{ fill: #41b6e6; }
    }
  </style>

  <defs>
    <!-- Document 44 x 46 : coin coupé à 45° de (28,0) à (44,16) -->
    <g id="doc">
      <path d="M6 0 H28 L44 16 V40 Q44 46 38 46 H6 Q0 46 0 40 V6 Q0 0 6 0 Z"/>
      <!-- Pli : l'hypoténuse (28,0)→(44,16) est exactement la ligne de coupe -->
      <path d="M28 0 L44 16 H32 Q28 16 28 12 Z" fill="#fff" fill-opacity="0.25"/>
    </g>
  </defs>

  <!-- Fond -->
  <rect class="lg-bg" width="170" height="170" rx="36"/>

  <!-- Logo : centré optiquement (translate Y remonté) -->
  <g transform="translate(7.5 7.5) scale(0.84)">
    <g class="lg-link" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="91" y1="100" x2="91" y2="60"/>
      <line x1="91" y1="100" x2="56.4" y2="120"/>
      <line x1="91" y1="100" x2="125.6" y2="120"/>
    </g>

    <use href="#doc" class="lg-top"   x="69"  y="17"/>
    <use href="#doc" class="lg-left"  x="21"  y="104"/>
    <use href="#doc" class="lg-right" x="120" y="104"/>

    <circle class="lg-hub" cx="91" cy="100" r="14"/>
  </g>
</svg>